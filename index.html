<body>

	<script>
		let php = 100; //given value in peso

		document.write("<h2>Convert this number</h2>" + "<kbd>" +php+ "</kbd>" + "<h2>to different currencies</h2>");
	</script>

	<br>
	<p id="display"></p>

	<button type="button" class="btn btn-primary" onclick="let php = 100; let dollar = 58.21; document.getElementById('display').innerHTML= '<kbd>' + dollar + '</kbd';">Dollar</button>

	<button type="button" class="btn btn-info" onclick="let php = 100; let yen = 268.69; document.getElementById('display').innerHTML= '<kbd>' + yen + '</kbd';">Yen</button>
